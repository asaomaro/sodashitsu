# aidev 設定（キー一覧: ~/.claude/skills/aidev-docs/bin/README.md の設定表）
# 起動確認（smoke）: design（20260918-web-terminal-multiplexer の D15・D3）で決めた。
# ビルドしたサーバを空きポートで起動し、正規のログイン → workspace 作成 → echo の往復を確かめて終了する。
# 2本目（20260923-external-control-api）: sodactl（packages/cli）が足した外部操作 CLI という新しい入口を、
# ビルド済みの dist/main.js を子プロセスとして実際に起動して確かめる（login 不要のセッションキャッシュ
# 再利用を含む）。1本目が `pnpm -s build` で全パッケージを先にビルドするので、2本目は再ビルドしない。
# 3本目（20260926-named-session）: 名前付き session の新しい入口（`soda token reset --session`・`soda session list`・
# `soda session delete`）を、ビルド済みの `soda`（packages/server/dist/main.js）で一時ディレクトリに対して一巡させる。
# 4本目（20260926-agent-skill-file）: `sodactl skill` が、誰も待ち受けていない接続先のままでもビルド済みの sodactl から skill ファイルと同じ内容を出すこと。
# 5本目（20260926-named-session-ui）: CLI の入口の `SODA_SESSION` を、ビルド済みの `soda` で確かめる（名前付き session の token だけを作り直し、
# 規則外の値は何も作らずに終了コード 2）。`main.ts` は単体テストできない（読み込むと起動する）ので、配線はここで見る。
# 6本目（20260926-live-handoff）: 更新時の引き継ぎ。ビルドした `dist/main.js` で `soda serve` を起動し、実物の `soda handoff`（execve で同じ入口に入れ替わる）の後も
# サーバと pane のシェルの pid・前の画面・入出力・大きさ・終了の検知が保たれること、動いていなければ終了コード 3 で何も作らないことを確かめる
# （execve の先がビルドした成果物なので vitest では確かめられない。Windows では何もせず成功）。
# 7本目（20260927-session-stop）: `soda session stop`。ビルドした `dist/main.js` で `soda serve --session smoke --pane-history` を起動し、実物の
# `soda session stop smoke` で止まる（CLI 0・サーバ 0・一覧が stopped・ロックの解放・状態の保存）こと、動いていない・止まった後は終了コード 3 で何も作らないこと、
# 起動し直すと同じ pane と前回の画面が戻ることを確かめる（止める指示と `main.ts` の停止の手順の配線は vitest では見られない。Windows では何もせず成功）。
# 8本目（20260927-multi-host-machines）: 保存した SSH のマシン。ビルドした `dist/main.js` で 2 つの状態ディレクトリを「手元」「リモート」に見立て、`PATH` の先頭に置いた偽の `ssh`
# （引数を記録し `soda bridge` をこのマシンで実行する）で `soda machine add` → 手元の `soda serve` の接続（online）→ `/ws?machine=` 越しの hello・workspace の作成・echo を確かめる
# （`soda bridge` の子プロセスと `bridge.sock` の配線は vitest では見られない。Windows では何もせず成功）。
# 9本目（20260927-rename-sodashitsu）: 一度きりの移行スクリプト `scripts/migrate-from-wtm.sh`。一時的な HOME・XDG_STATE_HOME だけの環境（env -i）で
# `~/.wtmctl` を移し、2 回目は「移すものがありません」になることを確かめる（利用者の本物の状態には触れない）。
smokeCommands:
  - pnpm -s build && pnpm -s smoke
  - pnpm --filter @sodashitsu/cli run smoke
  - d=$(mktemp -d) && mkdir -p "$d/sessions/smoke" && node packages/server/dist/main.js token reset --session smoke --state-dir "$d" && test -f "$d/sessions/smoke/auth.json" && node packages/server/dist/main.js session list --state-dir "$d" | grep -q '^smoke ' && node packages/server/dist/main.js session delete smoke --state-dir "$d" && test ! -e "$d/sessions/smoke"; rc=$?; rm -rf "$d"; exit $rc
  - SODACTL_URL=http://127.0.0.1:9 node packages/cli/dist/main.js skill | cmp - packages/cli/skills/sodactl/SKILL.md
  - d=$(mktemp -d) && mkdir -p "$d/sessions/smoke" && SODA_SESSION=smoke node packages/server/dist/main.js token reset --state-dir "$d" && test -f "$d/sessions/smoke/auth.json" && test ! -e "$d/auth.json" && { SODA_SESSION=a/b node packages/server/dist/main.js token reset --state-dir "$d" 2>/dev/null; test $? -eq 2; } && test ! -e "$d/auth.json"; rc=$?; rm -rf "$d"; exit $rc
  - node packages/server/dist/handoffSmoke.js
  - node packages/server/dist/stopSmoke.js
  - node packages/server/dist/machineSmoke.js
  - d=$(mktemp -d) && mkdir -p "$d/home/.wtmctl" && env -i PATH="$PATH" HOME="$d/home" XDG_STATE_HOME="$d/state" sh scripts/migrate-from-wtm.sh >"$d/out" && grep -q '^済み: CLI のキャッシュを移す' "$d/out" && test -d "$d/home/.sodactl" && env -i PATH="$PATH" HOME="$d/home" XDG_STATE_HOME="$d/state" sh scripts/migrate-from-wtm.sh | grep -q '移すものがありません'; rc=$?; rm -rf "$d"; exit $rc
smokeTimeoutSec: 180
tracker: none
