name: Desktop Node identity (generated keys)
on:
  pull_request:
    paths:
      - 'packages/client-core/src/desktop/*.node*'
      - 'packages/client-core/package.json'
      - 'packages/cli/src/commands/desktopIdentity*'
      - 'packages/cli/src/cliArgs.ts'
      - 'packages/cli/src/main.ts'
      - 'packages/server/src/desktop/DesktopEndpoint*'
      - 'packages/server/src/desktop/DesktopWindows*'
      - 'scripts/remote-desktop/**'
      - '.github/workflows/desktop-node-identity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-node-identity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Generated stdin stop protocol and clean Node exit (no service or desktop)
        shell: powershell
        run: node scripts/remote-desktop/validate-signin-stop.mjs
      - name: Install pinned pnpm in the runner temporary directory
        shell: powershell
        run: npm install --prefix "$env:RUNNER_TEMP\soda-pnpm" pnpm@9.15.9 --ignore-scripts
      - name: Build the Node identity library without desktop or PTY activation
        shell: powershell
        run: |
          $pnpm = Join-Path $env:RUNNER_TEMP 'soda-pnpm\node_modules\pnpm\bin\pnpm.cjs'
          node $pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node $pnpm -r --filter '@sodashitsu/cli...' run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generated current-user DPAPI vault and pinned agent handshake
        shell: powershell
        run: |
          node scripts/remote-desktop/validate-node-identity.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/remote-desktop/validate-cli-identity.mjs
      - name: Generated fixed bundle and staging checks (no real package or services)
        shell: powershell
        run: |
          node scripts/remote-desktop/validate-signin-bootstrap.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/remote-desktop/validate-signin-package.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/remote-desktop/validate-signin-node-negative.mjs

      - name: Generated server-process checkpoint crash boundaries (private disposable files only)
        shell: powershell
        run: node scripts/remote-desktop/validate-transfer-checkpoints.mjs
      - name: Generated folder checkpoint process-restart boundaries (private disposable files only)
        shell: powershell
        run: node scripts/remote-desktop/validate-folder-checkpoints.mjs
      - name: Generated native drag data/COM/framing kernel (no real desktop or input)
        shell: powershell
        run: scripts/remote-desktop/validate-native-drag-lease.ps1
      - name: Generated Explorer selection admission (no real desktop)
        shell: powershell
        run: scripts/remote-desktop/validate-explorer-selection.ps1
      - name: Generated native drag request registration and stream pump
        shell: powershell
        run: scripts/remote-desktop/validate-native-drag-pump.ps1
      - name: Generated private native drag slot and retained process exit (owned fixtures only)
        shell: powershell
        run: scripts/remote-desktop/validate-native-drag-slot.ps1
      - name: Generated STA worker lifecycle with fake desktop/OLE and blocked owned processes
        shell: powershell
        run: scripts/remote-desktop/validate-native-drag-worker.ps1
      - name: Generated physical pointer witness input path (memory endpoints only)
        shell: powershell
        run: scripts/remote-desktop/validate-pointer-witness.ps1
      - name: Generated Explorer selection worker and owned blocked-input exit
        shell: powershell
        run: scripts/remote-desktop/validate-explorer-selection-worker.ps1
      - name: Generated real CSharp pump and Node host (memory target, no OLE)
        shell: powershell
        run: scripts/remote-desktop/validate-native-host.ps1
      - name: Generated private audio/microphone pipe bridge (memory only, no audio devices)
        shell: powershell
        run: node scripts/remote-desktop/validate-audio-pipe.mjs
