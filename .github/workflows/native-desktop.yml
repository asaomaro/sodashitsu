name: macOS audio SDK contract (headers only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headers:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Read official SDK ownership and device property comments
        run: |
          python3 - <<'PY'
          import subprocess,pathlib
          sdk=pathlib.Path(subprocess.check_output(['xcrun','--show-sdk-path'],text=True).strip())
          for framework,name,words in [('AudioToolbox','AudioQueue.h',['kAudioQueueProperty_CurrentDevice','AudioQueueGetProperty(']),('CoreAudio','AudioHardwareBase.h',['kAudioDevicePropertyDeviceUID'])]:
              path=next((sdk/'System/Library/Frameworks'/f'{framework}.framework').rglob(name));lines=path.read_text().splitlines()
              print('SDK HEADER',framework,name)
              for i,line in enumerate(lines):
                  if any(word in line for word in words):
                      print('\n'.join(lines[max(0,i-12):min(len(lines),i+25)]))
          PY
