name: Temporary Windows transfer fixture diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-generated:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm -r --filter '@sodashitsu/server...' run build
      - run: pnpm exec vitest run packages/server/src/desktop/DesktopSettings.test.ts -t 'rejects replayed completed checkpoints' --maxWorkers=1
