name: Desktop assistant foundation
on:
  pull_request:
    paths:
      - 'packages/desktop-assistant/**'
      - 'packages/protocol/**'
      - 'packages/server/src/assistant/**'
      - 'packages/server/src/ask/**'
      - 'packages/web/src/store/ask*'
      - 'packages/web/src/actions/assistantPanel*'
      - 'packages/server/src/session/**'
      - 'packages/server/src/persist/SessionFile.ts'
      - 'packages/server/src/surface/methods/assistant.ts'
      - 'packages/server/src/surface/methods/agent.ts'
      - 'packages/server/src/composeServer.ts'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop-assistant.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-assistant-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generated-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @sodashitsu/desktop-assistant build
      - run: pnpm --filter @sodashitsu/desktop-assistant typecheck
      - name: Compile foreground probe declarations only (no Win32 calls)
        run: node packages/desktop-assistant/scripts/verify-foreground.mjs
      - name: Generated adapters only (no desktop, agent, microphone or login registration)
        run: pnpm exec vitest run --project @sodashitsu/desktop-assistant --maxWorkers=2
      - name: Generated Windows package install and rollback (never execute package contents)
        run: pnpm exec vitest run --project @sodashitsu/server src/assistant/AssistantPackage.test.ts
      - run: pnpm --filter @sodashitsu/desktop-assistant exec playwright install chromium
      - name: Generated headless keyboard UI
        run: pnpm --filter @sodashitsu/desktop-assistant verify:ui
      - name: Build unsigned development zip (do not install or launch)
        run: pnpm --filter @sodashitsu/desktop-assistant pack:win
      - uses: actions/upload-artifact@v4
        with:
          name: sodashitsu-assistant-windows-x64
          path: packages/desktop-assistant/release/*.zip
          if-no-files-found: error
          retention-days: 7

  generated-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @sodashitsu/server build
      - run: pnpm --filter @sodashitsu/server typecheck
      - run: pnpm --filter @sodashitsu/web build
      - run: pnpm --filter @sodashitsu/web typecheck
      - name: Ownership and queued input with memory terminals (no actual agent or PTY)
        run: pnpm exec vitest run --maxWorkers=2 --project @sodashitsu/server --project @sodashitsu/protocol --project @sodashitsu/client-core --project @sodashitsu/web src/assistant desktopAssistant src/schedule/Scheduler.test.ts src/node/pluginPackage.test.ts src/actions/assistantPanel src/actions/MachineWiring.test.ts src/store/ask.test.ts src/ask/AskService.test.ts
