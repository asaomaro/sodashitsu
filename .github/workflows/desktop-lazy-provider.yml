name: Lazy desktop provider (generated only)
on:
  pull_request:
    paths:
      - 'packages/server/src/desktop/**'
      - 'packages/server/src/composeServer.ts'
      - 'packages/server/src/surface/methods/deps.ts'
      - '.github/workflows/desktop-lazy-provider.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generated:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @sodashitsu/server build
      - run: pnpm exec vitest run packages/server/src/desktop/LazyDesktopProvider.test.ts packages/server/src/desktop/LazyDesktopModules.test.ts packages/server/src/desktop/DesktopSettings.test.ts packages/server/src/desktop/DesktopNativePlatform.test.ts packages/server/src/desktop/DesktopEndpointService.test.ts --maxWorkers=2
      - name: Actual generated helper through cold provider (no desktop)
        run: pnpm exec vitest run packages/server/src/desktop/DesktopRelay.test.ts -t 'cold lazy provider' --maxWorkers=1
