name: Assistant runtime preparation (no binary execution)
on:
  pull_request:
    paths:
      - 'packages/server/src/assistant/AssistantRuntime*'
      - 'packages/server/assets/assistant-runtime.json'
      - '.github/workflows/assistant-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generated archives, private HTTPS and immutable cache only
        run: pnpm exec vitest run packages/server/src/assistant/AssistantRuntimeZip.test.ts packages/server/src/assistant/AssistantRuntimeDownload.test.ts packages/server/src/assistant/AssistantRuntimeCache.test.ts --maxWorkers=2
