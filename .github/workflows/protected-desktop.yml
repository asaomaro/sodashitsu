name: Protected desktop boundaries (generated checks)
on:
  push:
    branches: [feat/desktop-secure-sessions, fix/desktop-protected-observer, feat/desktop-elevated-handshake, feat/desktop-protected-worker-backend]
    paths: ['scripts/remote-desktop/**', '.github/workflows/protected-desktop.yml']
  pull_request:
    paths: ['scripts/remote-desktop/**', '.github/workflows/protected-desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: protected-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  boundaries:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Generated signin OS scope (no capture, input, or service)
        shell: powershell
        run: scripts/remote-desktop/validate-signin-scope.ps1
      - name: Dedicated signin worker compilation (no worker launch)
        shell: powershell
        run: scripts/remote-desktop/build-signin-host.ps1 -ValidateOnly -OwnerSid S-1-5-21-1-2-3-1001
      - name: Compile and inspect single privileged image with generated negative controls
        shell: powershell
        run: scripts/remote-desktop/validate-signin-native.ps1 -NegativeControls
      - name: Generated signin worker input, topology, and negative controls (no OS input)
        shell: powershell
        run: scripts/remote-desktop/validate-signin-worker.ps1 -NegativeControls
      - name: Generated ACL descriptor facts (no filesystem ACL writes)
        shell: powershell
        run: scripts/remote-desktop/validate-endpoint-acl-facts.ps1
      - name: Generated package data, ACL, and ordinary temporary file handle checks
        shell: powershell
        run: scripts/remote-desktop/validate-signin-package.ps1 -NegativeControls
      - name: Generated ordinary signin host child and descendant checks (no service install)
        shell: powershell
        run: scripts/remote-desktop/validate-signin-host.ps1 -NegativeControls
      - name: Generated release source validation (ordinary temporary files)
        shell: powershell
        run: |
          scripts/remote-desktop/validate-signin-install-source.ps1 -NegativeControls
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Local admin controller compilation only
        shell: powershell
        run: |
          scripts/remote-desktop/control-signin-admin.ps1 -ValidateOnly -OwnerSid S-1-5-21-1-2-3-1001 -ManifestSha256 ('a' * 64)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Dedicated service controller compilation only
        shell: powershell
        run: |
          scripts/remote-desktop/control-signin-service.ps1 -ValidateOnly -OwnerSid S-1-5-21-1-2-3-1001 -ManifestSha256 ('a' * 64)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generated retained ordinary process evidence (no service control)
        shell: powershell
        run: scripts/remote-desktop/validate-signin-process-evidence.ps1 -NegativeControls
      - name: Generated immutable quiescence barrier (ordinary temporary files only)
        shell: powershell
        run: scripts/remote-desktop/validate-signin-quiescence.ps1 -NegativeControls
      - name: Validate signin SCM policy with generated data only
        shell: powershell
        run: ./scripts/remote-desktop/validate-signin-service-policy.ps1 -NegativeControls
      - name: Generated SYSTEM enrollment crypto and ACL checks (no real vault reads)
        shell: powershell
        run: scripts/remote-desktop/validate-signin-vault.ps1
      - name: Generated direct OS scope boundaries
        shell: powershell
        run: scripts/remote-desktop/validate-protected-scope.ps1
      - name: Generated protected video publication and negative controls (no capture or encoder)
        shell: powershell
        run: scripts/remote-desktop/validate-protected-video.ps1 -NegativeControls
      - name: Ordinary-user audio role and generated private PCM (no audio device activation)
        shell: powershell
        run: scripts/remote-desktop/validate-user-audio.ps1 -NegativeControls
      - name: Owned virtual display mode guards (generated driver only)
        shell: powershell
        run: scripts/remote-desktop/validate-virtual-modes.ps1 -NegativeControls
      - name: Existing helper entry-point compilation
        shell: powershell
        # The endpoint query-denial validator requires
        # a non-administrator account; it runs on both user PCs separately.
        run: scripts/remote-desktop/windows-helper.ps1 -ValidateOnly
      - name: Generated protected worker handshake and purpose checks
        shell: powershell
        run: scripts/remote-desktop/validate-protected-worker.ps1
      - name: Prepared helper image compilation only
        shell: powershell
        run: scripts/remote-desktop/prepare-desktop-helper.ps1 -ValidateOnly -OwnerSid S-1-5-21-1-2-3-1001
      - name: Existing generated monitor checks
        shell: powershell
        run: scripts/remote-desktop/validate-monitors.ps1

      - name: Generated audio PCM and private pipe checks (no audio devices)
        shell: powershell
        run: scripts/remote-desktop/validate-audio.ps1

      - name: Generated microphone PCM and private pipe checks (no audio devices)
        shell: powershell
        run: scripts/remote-desktop/validate-microphone.ps1

      - name: Generated endpoint key protection (current user, no desktop)
        shell: powershell
        run: scripts/remote-desktop/validate-endpoint-key.ps1

      - name: Generated signed-out candidate checks (no native queries)
        shell: powershell
        run: scripts/remote-desktop/validate-signin-candidate.ps1 -NegativeControls
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Current-schema upgrade compilation only (no SCM/state access)
        shell: powershell
        run: scripts/remote-desktop/upgrade-signin-service.ps1 -ValidateOnly -OwnerSid S-1-5-21-1-2-3-1001 -OldManifestSha256 ('a' * 64) -ManifestSha256 ('b' * 64) -SourceDirectory 'C:\generated-unused'
