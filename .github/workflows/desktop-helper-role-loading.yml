name: Desktop helper optional roles (generated only)
on:
  pull_request:
    paths:
      - 'packages/server/src/desktop/DesktopHelperRolePlan*'
      - 'packages/server/src/desktop/DesktopProvider*'
      - 'packages/server/src/desktop/DesktopSettings*'
      - 'packages/server/src/desktop/DesktopSharedCapture*'
      - 'scripts/remote-desktop/windows-helper.ps1'
      - 'scripts/remote-desktop/WindowsDesktop*.cs'
      - 'scripts/remote-desktop/WindowsResourceFence.cs'
      - 'scripts/remote-desktop/WindowsVirtualDisplay*.cs'
      - 'scripts/remote-desktop/WindowsProtected*.cs'
      - 'scripts/remote-desktop/WindowsCodecProbe.cs'
      - 'scripts/remote-desktop/WindowsAudioChecks.cs'
      - 'scripts/remote-desktop/WindowsMicrophoneChecks.cs'
      - 'scripts/remote-desktop/EndpointAclPolicy.ps1'
      - 'scripts/remote-desktop/check-endpoint-acl.ps1'
      - 'scripts/remote-desktop/validate-audio.ps1'
      - 'scripts/remote-desktop/validate-microphone.ps1'
      - 'scripts/remote-desktop/verify-helper-role-loading.mjs'
      - 'scripts/package.mjs'
      - '.github/workflows/desktop-helper-role-loading.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generated:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Compile actual helper with unselected sources physically absent; ValidateOnly only
        run: node scripts/remote-desktop/verify-helper-role-loading.mjs
  node-policy:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm -r --filter '@sodashitsu/server...' run build
      - run: pnpm exec vitest run packages/server/src/desktop/DesktopHelperRolePlan.test.ts packages/server/src/desktop/DesktopProvider.test.ts packages/server/src/desktop/DesktopProvider.audio.test.ts packages/server/src/desktop/DesktopProtectedAudio.test.ts packages/client-core/src/desktop/DesktopNativeRoleBinary.node.test.ts packages/server/src/desktop/DesktopSharedCapture.test.ts packages/server/src/desktop/DesktopSettings.test.ts --maxWorkers=2
