name: Native runtime distribution (no device execution)
on:
  pull_request:
    paths:
      - 'scripts/package.mjs'
      - 'scripts/remote-desktop/**'
      - 'packages/server/assets/**'
      - '.github/workflows/native-runtime-distribution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Package fixed resources (Mac compile and ad-hoc signature only)
        run: node scripts/package.mjs --no-build --no-install --no-archive
      - name: Compare SDK inventory, dependencies and bytes without executing devices
        run: node scripts/remote-desktop/verify-runtime-assets.mjs
