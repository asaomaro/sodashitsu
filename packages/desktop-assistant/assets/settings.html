<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>操舵室アシスタント設定</title><link rel="stylesheet" href="style.css"></head><body class="settings"><h1>操舵室アシスタント</h1><form id="form"><label><input id="enabled" type="checkbox"> アシスタントを有効にする</label><label>表示<select id="mode"><option value="character">キャラクターと通知領域アイコン</option><option value="tray">通知領域アイコンのみ</option></select></label><label>船長<select id="characterId"><option value="captain-male">男性船長</option><option value="captain-female">女性船長</option><option value="captain-robot">ロボット船長</option></select></label><label>キャラクターの大きさ<input id="characterSize" type="number" min="64" max="512" required></label><label>操舵室の接続先<input id="serverOrigin" type="url" required placeholder="http://127.0.0.1:7780"></label><p>WSLで起動した操舵室にも、Windowsのlocalhostから接続できます。ログインは「操舵室を開く」から行います。</p><label><input id="launchAtLogin" type="checkbox"> Windowsへのログイン時に起動（配布版）</label><label><input id="mute" type="checkbox"> 通知で吹き出しを開かない（会話から確認できます）</label><label><input id="reducedMotion" type="checkbox"> 動きを抑える</label><fieldset><legend>ローカル文字起こし</legend><label><input id="transcriptionEnabled" type="checkbox"> 音声ファイルの文字起こしを有効にする</label><label>このPCのWhisperサーバ<input id="transcriptionOrigin" type="url" required placeholder="http://127.0.0.1:8080"></label><p>Whisperのモデルとサーバは別途用意してください。音声は選択時だけこのローカルサーバへ送り、認識結果を確認してから会話へ渡します。マイク録音はまだ未対応です。</p></fieldset><button type="submit">保存</button> <button type="button" id="open">操舵室を開く</button><p id="status" role="status"></p></form><script src="settings.js"></script></body></html>
