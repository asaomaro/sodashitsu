<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>船長と話す</title><script src="appearance.js"></script><link rel="stylesheet" href="style.css"></head><body class="bubble"><main class="speech"><header><img id="portrait" alt="船長"><div><strong id="captain-name">船長</strong><p id="destination">専用アシスタント</p></div><div class="window-controls" aria-label="ウィンドウ操作"><button type="button" data-window-action="maximize" aria-label="最大化" title="最大化">□</button><button id="hide" type="button" data-window-action="close" aria-label="吹き出しを閉じる" title="閉じる">×</button></div></header><button id="notification-indicator" type="button" hidden aria-live="polite"></button><div class="speech-content"><details id="notice-section" class="assistant-section" open hidden><summary id="notice-section-summary">通知・確認待ち</summary><div id="notices" role="region" aria-label="確認待ち・質問" aria-live="polite" hidden></div></details><details id="agent-roster" class="assistant-section" open><summary id="agent-roster-summary">エージェント一覧</summary><label for="agent-filter">表示する状態</label><select id="agent-filter"><option value="all">すべて</option><option value="working">作業中</option><option value="blocked">確認待ち</option><option value="idle">待機中</option></select><p id="agent-roster-status" role="status">接続を確認しています。</p><ul id="agent-roster-rows" aria-label="起動中のエージェント"></ul></details><details class="assistant-section" open hidden data-collapse-empty="reminder-notices"><summary>リマインダー</summary><div id="reminder-notices" aria-label="リマインダーの通知" hidden></div></details><details id="conversation-section" class="assistant-section" open><summary>会話</summary><section id="conversation" role="log" aria-live="polite"><p class="spoken">こんにちは。操舵室の船長です。</p><p class="spoken" id="connection">専用セッションを確認しています。</p></section><form id="chat"><label for="message">船長へのメッセージ</label><textarea id="message" rows="2" disabled placeholder="専用セッションに接続すると会話できます"></textarea><button id="send" disabled>送信</button></form></details><details id="session-section" class="assistant-section" open><summary>専用セッション</summary><p id="session-status" role="status"></p><div id="session-controls"><label for="agent-kind">種類</label><select id="agent-kind"></select><label for="agent-model">モデル</label><select id="agent-model"><option value="">エージェントの既定値</option></select><label for="agent-effort">effort</label><select id="agent-effort"><option value="">エージェントの既定値</option></select><p id="model-options-status" role="status"></p><button id="refresh-models" data-assistant-action type="button">モデル候補を再取得</button><p id="captain-choice-status" role="status"></p><button id="start-session" type="button" disabled>専用セッションを開始</button><button id="expand-session" type="button" disabled>船長の端末を開く</button><button id="stop-session" type="button" disabled>船長を停止</button><button id="adopt-session" type="button" hidden>このエージェントを使う</button></div></details><nav aria-label="アシスタントの操作"><button id="open-tools" type="button">ツールを開く</button><button id="open">操舵室を開く</button><button id="settings">設定</button></nav><details id="connection-section" class="assistant-section" open><summary>接続・起動情報</summary><p id="status" role="status"></p><p id="launch-settings" role="status"></p></details><button id="voice-stop" type="button" hidden>読み上げを止める</button></div></main><span class="speech-tail" aria-hidden="true"></span><script src="sections.js"></script><script src="resize.js"></script><script src="window.js"></script><script src="bubble.js"></script><script src="reminder-notices.js"></script></body></html>
