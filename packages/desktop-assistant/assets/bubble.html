<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>船長と話す</title><link rel="stylesheet" href="style.css"></head><body class="bubble"><main class="speech"><header><img id="portrait" alt="船長"><div><strong id="captain-name">船長</strong><p id="destination">専用アシスタント</p></div><button id="hide" aria-label="吹き出しを閉じる">×</button></header><button id="notification-indicator" type="button" hidden aria-live="polite"></button><div class="speech-content"><div id="notices" role="region" aria-label="確認待ち・質問" aria-live="polite" hidden></div><details id="agent-roster" open><summary id="agent-roster-summary">エージェント一覧</summary><label for="agent-filter">表示する状態</label><select id="agent-filter"><option value="all">すべて</option><option value="working">作業中</option><option value="blocked">確認待ち</option><option value="idle">待機中</option></select><p id="agent-roster-status" role="status">接続を確認しています。</p><ul id="agent-roster-rows" aria-label="起動中のエージェント"></ul></details><div id="reminder-notices" aria-label="リマインダーの通知" hidden></div><section id="conversation" role="log" aria-live="polite"><p class="spoken">こんにちは。操舵室の船長です。</p><p class="spoken" id="connection">専用セッションを確認しています。</p></section><p id="session-status" role="status"></p><div id="session-controls"><label for="agent-kind">使うエージェント</label><select id="agent-kind"></select><button id="start-session" type="button" disabled>専用セッションを開始</button><button id="adopt-session" type="button" hidden>このエージェントを使う</button></div></div><nav aria-label="アシスタントの操作"><button id="open-tools" type="button">ツールを開く</button><button id="expand-session" type="button">専用端末・フォームを開く</button><button id="open">操舵室を開く</button><button id="settings">設定</button></nav><form id="chat"><label for="message">船長へのメッセージ</label><textarea id="message" rows="2" disabled placeholder="専用セッションに接続すると会話できます"></textarea><button id="send" disabled>送信</button></form><p id="status" role="status"></p><p id="launch-settings" role="status"></p><button id="voice-stop" type="button" hidden>読み上げを止める</button></main><span class="speech-tail" aria-hidden="true"></span><script src="resize.js"></script><script src="bubble.js"></script><script src="reminder-notices.js"></script></body></html>
