<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>船長と話す</title><link rel="stylesheet" href="style.css"></head><body class="bubble"><main class="speech"><header><img id="portrait" alt="船長"><div><strong id="captain-name">船長</strong><p id="destination">専用アシスタント</p></div><button id="hide" aria-label="吹き出しを閉じる">×</button></header><section id="conversation" role="log" aria-live="polite"><p class="spoken">こんにちは。操舵室の船長です。</p><p class="spoken" id="connection">専用セッションを確認しています。</p></section><p id="session-status" role="status"></p><div id="session-controls"><label for="agent-kind">使うエージェント</label><select id="agent-kind"></select><button id="start-session" type="button" disabled>専用セッションを開始</button><button id="adopt-session" type="button" hidden>このエージェントを使う</button></div><details id="standard-tools"><summary>標準ツール</summary><div class="tools-body"><p>文章は確認後に会話へ渡します。メモと読み上げはローカルで扱います。</p><label for="tool-text">扱う文章（8192文字以内）</label><textarea id="tool-text" rows="3" maxlength="8192"></textarea><div class="tool-actions"><button id="read-clipboard" type="button">コピーした文章を読み込む</button><button id="copy-tool-text" type="button">文章をコピー</button><button id="prepare-summary" type="button">要約の文面を作る</button><select id="translation-language" aria-label="翻訳先"><option value="日本語">日本語</option><option value="英語">英語</option></select><button id="prepare-translation" type="button">翻訳の文面を作る</button><button id="read-aloud" type="button">読み上げ</button><button id="stop-reading" type="button">読み上げを止める</button></div><label for="saved-notes">この端末のメモ</label><select id="saved-notes"><option value="">新しいメモ</option></select><div class="tool-actions"><button id="save-note" type="button">メモを保存</button><button id="delete-note" type="button" disabled>メモを削除</button></div><hr><p id="transcription-route"></p><div class="tool-actions"><button id="transcribe-file" type="button">音声ファイルを文字起こし</button><button id="cancel-transcription" type="button" disabled>文字起こしを停止</button></div><p id="transcription-status" role="status"></p><label for="transcription-result">文字起こしの結果（確認・編集）</label><textarea id="transcription-result" rows="3" maxlength="65536"></textarea><button id="use-transcription" type="button">結果を扱う文章へ</button><p id="tools-status" role="status"></p></div></details><nav aria-label="アシスタントの操作"><button id="open">操舵室を開く</button><button id="settings">設定</button></nav><form id="chat"><label for="message">船長へのメッセージ</label><textarea id="message" rows="2" disabled placeholder="専用セッションに接続すると会話できます"></textarea><button id="send" disabled>送信</button></form><p id="status" role="status"></p></main><script src="bubble.js"></script><script src="tools.js"></script></body></html>
