<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>船長と話す</title><link rel="stylesheet" href="style.css"></head><body class="bubble"><main class="speech"><header><img id="portrait" alt="船長"><div><strong id="captain-name">船長</strong><p id="destination">専用アシスタント</p></div><button id="hide" aria-label="吹き出しを閉じる">×</button></header><section id="conversation" role="log" aria-live="polite"><p class="spoken">こんにちは。操舵室の船長です。</p><p class="spoken" id="connection">専用セッションを確認しています。</p></section><p id="session-status" role="status"></p><div id="session-controls"><label for="agent-kind">使うエージェント</label><select id="agent-kind"></select><button id="start-session" type="button" disabled>専用セッションを開始</button><button id="adopt-session" type="button" hidden>このエージェントを使う</button></div><nav aria-label="アシスタントの操作"><button id="open">操舵室を開く</button><button id="settings">設定</button></nav><form id="chat"><label for="message">船長へのメッセージ</label><textarea id="message" rows="2" disabled placeholder="専用セッションに接続すると会話できます"></textarea><button id="send" disabled>送信</button></form><p id="status" role="status"></p></main><script src="bubble.js"></script></body></html>
