<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>船長と話す</title><link rel="stylesheet" href="style.css"></head><body class="bubble"><main class="speech"><header><img id="portrait" alt="船長"><div><strong id="captain-name">船長</strong><p id="destination">専用アシスタント</p></div><button id="hide" aria-label="吹き出しを閉じる">×</button></header><p id="record-indicator" role="status" hidden>● マイクを録音しています <button id="record-stop-visible" type="button">録音停止</button></p><section id="conversation" role="log" aria-live="polite"><p class="spoken">こんにちは。操舵室の船長です。</p><p class="spoken" id="connection">専用セッションを確認しています。</p></section><p id="session-status" role="status"></p><div id="session-controls"><label for="agent-kind">使うエージェント</label><select id="agent-kind"></select><button id="start-session" type="button" disabled>専用セッションを開始</button><button id="adopt-session" type="button" hidden>このエージェントを使う</button></div><details id="standard-tools"><summary>標準ツール</summary><div class="tools-body"><p>文章は確認後に会話へ渡します。メモと読み上げはローカルで扱います。</p><label for="tool-text">扱う文章（8192文字以内）</label><textarea id="tool-text" rows="3" maxlength="8192"></textarea><div class="tool-actions"><button id="read-clipboard" type="button">コピーした文章を読み込む</button><button id="copy-tool-text" type="button">文章をコピー</button><button id="prepare-summary" type="button">要約の文面を作る</button><select id="translation-language" aria-label="翻訳先"><option value="日本語">日本語</option><option value="英語">英語</option></select><button id="prepare-translation" type="button">翻訳の文面を作る</button><button id="read-aloud" type="button">読み上げ</button><button id="stop-reading" type="button">読み上げを止める</button></div><label for="saved-notes">この端末のメモ</label><select id="saved-notes"><option value="">新しいメモ</option></select><div class="tool-actions"><button id="save-note" type="button">メモを保存</button><button id="delete-note" type="button" disabled>メモを削除</button></div><hr><p id="transcription-route"></p><div class="tool-actions"><button id="record-start" type="button" disabled>マイクの録音開始</button><button id="record-stop" type="button" disabled>録音停止</button><button id="record-discard" type="button" disabled>録音を破棄</button><button id="record-transcribe" type="button" disabled>録音を文字起こし</button></div><p id="record-status" role="status">マイクは録音開始を押したときだけ使います。</p><button id="record-preview" type="button" hidden>録音を試聴</button><div class="tool-actions"><button id="transcribe-file" type="button">音声ファイルを文字起こし</button><button id="cancel-transcription" type="button" disabled>文字起こしを停止</button></div><p id="transcription-status" role="status"></p><label for="transcription-result">文字起こしの結果（確認・編集）</label><textarea id="transcription-result" rows="3" maxlength="65536"></textarea><button id="use-transcription" type="button">結果を扱う文章へ</button><hr><details><summary>リマインダー</summary><p>指定した日時に、船長が言葉で知らせます。サーバを停止している間は実行されません。</p><label>見出し<input id="reminder-label" maxlength="100"></label><label>知らせる内容<textarea id="reminder-text" maxlength="1000" rows="2"></textarea></label><label>日時（この端末の時刻）<input id="reminder-date" type="datetime-local"></label><button id="reminder-save" type="button" disabled>この日時に知らせる</button><p id="reminder-status" role="status"></p><ul id="reminder-jobs"></ul></details><hr><details id="ocr-tools"><summary>画像から文字を読み取る（OCR）</summary><p>OSの画面切り取りで画像をコピーしてから取り込むか、PNGファイルを選びます。最大3840×2160・8MiB。画像と結果は5分で破棄します。</p><div class="tool-actions"><button id="ocr-clipboard" type="button" disabled>コピーした画像を取り込む</button><button id="ocr-file" type="button" disabled>PNGファイルを選ぶ</button><button id="ocr-discard" type="button" disabled>画像と結果を破棄</button></div><img id="ocr-preview" alt="認識する画像" hidden><fieldset class="ocr-region"><legend>切り出す範囲（画像の画素）</legend><label>左<input id="ocr-x" type="number" min="0" value="0"></label><label>上<input id="ocr-y" type="number" min="0" value="0"></label><label>幅<input id="ocr-width" type="number" min="1" value="1"></label><label>高さ<input id="ocr-height" type="number" min="1" value="1"></label></fieldset><div class="tool-actions"><button id="ocr-crop" type="button" disabled>この範囲に切り出す</button><button id="ocr-run" type="button" disabled>文字を認識</button></div><p id="ocr-status" role="status"></p><label for="ocr-result">認識結果（確認・編集）</label><textarea id="ocr-result" rows="3" maxlength="65536"></textarea><button id="ocr-use" type="button" disabled>認識結果を扱う文章へ</button></details><p id="tools-status" role="status"></p></div></details><nav aria-label="アシスタントの操作"><button id="expand-session" type="button">専用端末・フォームを開く</button><button id="open">操舵室を開く</button><button id="settings">設定</button></nav><form id="chat"><label for="message">船長へのメッセージ</label><textarea id="message" rows="2" disabled placeholder="専用セッションに接続すると会話できます"></textarea><button id="send" disabled>送信</button></form><p id="status" role="status"></p></main><script src="bubble.js"></script><script src="tools.js"></script><script src="recording.js"></script><script src="ocr.js"></script><script src="reminders.js"></script></body></html>
