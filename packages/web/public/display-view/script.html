<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>表示（スクリプト）</title>
<style>
/* 既定。:where で詳細度を 0 にしてあるので、中身のスタイルが常に勝つ。色は、親が render で渡す変数（アプリの --soda-*）で決まる。 */
:where(:root){color-scheme:light dark;--soda-bg:#1e1f29;--soda-fg:#f8f8f2;--soda-menu-bg:#282a36;--soda-menu-border:#44475a;--soda-accent:#6070a1;--soda-accent-fg:#f8f8f2;--soda-subtle-bg:rgba(255,255,255,.08);--soda-error-fg:#ff5555;--soda-warn-fg:#ffb86c}
:where(:root[data-dark="0"]){color-scheme:light}
:where(:root[data-dark="1"]){color-scheme:dark}
:where(html,body){margin:0}
:where(body){background:var(--soda-bg);color:var(--soda-fg);font:14px/1.6 system-ui,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",sans-serif;min-height:100vh}

<script>
// 表示の面（スクリプトが動く形式 `script-html`）の枠の土台。20261007-soda-extensions の design「スクリプトが動く形式」。
// アプリ本体の iframe（sandbox="allow-scripts"。allow-same-origin なし＝不透明 origin）が開く。親とのやりとりは MessageChannel の port だけ。
// **このスクリプトは頁の中に直に書く**（別ファイルにしない＝CSP の script-src に 'self' を付けない）。
// 中身（作者のスクリプトを含む）は、この土台の**あとで**、同じ window に **DOM として差し込む**（document.open()/document.write() は使わない）。

// 守り方: 中身のスクリプトは土台と同じ window で動き、プロトタイプ・グローバルを差し替えられる。土台の仕事（Esc の取り次ぎ・port への送受信・差し込み）を乗っ取られないよう、
//  - **読み込み時（中身が動く前）に、使う関数・getter・setter・コンストラクタを全部控える**。実行時に、グローバル・プロトタイプ・オブジェクトのメソッドを 1 つも読まない。

//  - 配列の添え字への代入・`for...of`・スプレッドを使わない（`Array.prototype` の添え字の setter・`Symbol.iterator` の差し替えの影響を受ける）。

// それでも、中身が port 自体を拾う・window を書き換える等は止められない（枠の外を守る。枠の中に、守るべきものを置かない。枠の言うことは、親とサーバが確かめる）。

  var msgPorts = typeof MessageEvent !== 'undefined' ? getterOf(MessageEvent.prototype, 'ports') : undefined;
  var msgSource = typeof MessageEvent !== 'undefined' ? getterOf(MessageEvent.prototype, 'source') : undefined;
  var portPost = typeof MessagePort === 'function' ? MessagePort.prototype.postMessage : undefined;
  var portOnmessageSet = typeof MessagePort === 'function' ? setterOf(MessagePort.prototype, 'onmessage') : undefined;
  var winFocus = WIN.focus;
  var winScrollBy = WIN.scrollBy;
  var parentPostMessage = undefined;
  try { parentPostMessage = PARENT.postMessage; } catch (e) { /* 親が窓でない（単体テストの偽物）ときは、下で直に呼ぶ */ }

  var ticket = '';
  try {
    var search = LOC.search; // 読み込み時（中身が動く前）に 1 回だけ読む
    var got = rApply(paramsGet, new UrlParams(search), ['t']);
    ticket = got === null || got === undefined ? '' : got;
  } catch (e) { ticket = ''; }

  var port = null;
  var inited = false;
  var portReal = false; // 受け取った port が本物の MessagePort か（中身が動く前の、受け取った時点で 1 回だけ決める）
  var rendered = false; // render は 1 つの枠につき 1 回だけ（2 回目以降は無視。中身・形式・版が替わったら、親が枠を作り直す）
  var rev = 0;
  // 受け手の名簿: null 原型の物に、数の id で入れる（`Array.prototype` を使わない）。
  var listeners = objCreate(null);
  var listenerCount = 0;

  function own(obj, key, value) { defProp(obj, key, { value: value, writable: true, enumerable: true, configurable: true }); }
  function mk() { return objCreate(null); }

  function post(msg) {
    if (!port) return;
    // 本物の MessagePort には、控えたメソッドで送る（中身がメソッドを差し替えても、port は拾われない）。
    // 本物の port では例外にならない。偽物（単体テスト）のときだけ、直に呼ぶ。
    if (portReal) rApply(portPost, port, [msg]);
    else port.postMessage(msg);
  }

  function isPlainStringMap(data) {
    if (typeof data !== 'object' || data === null) return false;
    if (rApply(arrayIsArray, undefined, [data])) return false;
    var keys = objKeys(data);
    if (keys.length > FIELDS_MAX) return false;
    var out = mk();
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      var v = data[k];

      own(out, k, v);
    }
    return rd(u8Length, rApply(encoderEncode, new Encoder(), [jsonStringify(out)]), 'length') <= DATA_MAX_BYTES;
  }

  /** window.soda。action は、規則の外の名前・値なら false を返して送らない（静的な形式の data-soda-action と同じ規則）。 */
  function makeSoda(theme) {
    var vars = mk();
    var dark = false;
    if (theme && typeof theme === 'object') {
      dark = !!theme.dark;
      var tv = theme.vars;
      if (tv && typeof tv === 'object') {
        var ks = objKeys(tv);
        for (var i = 0; i < ks.length; i++) if (typeof tv[ks[i]] === 'string') own(vars, ks[i], tv[ks[i]]);
      }
    }
    var th = mk();
    own(th, 'dark', dark);
    own(th, 'vars', objFreeze(vars));
    var soda = mk();
    own(soda, 'version', 1);
    own(soda, 'action', function (name, data) {
      if (typeof name !== 'string' || !rApply(RegExpTest, ACTION_RE, [name])) return false;
      if (data !== undefined && !isPlainStringMap(data)) return false;
      var m = mk();
      own(m, 'type', 'action');
      own(m, 'rev', rev);
      own(m, 'action', name);
      if (data !== undefined) {
        var copy = mk();
        var dk = objKeys(data);
        for (var i = 0; i < dk.length; i++) own(copy, dk[i], data[dk[i]]);
        own(m, 'data', copy);
      }
      post(m);
      return true;
    });
    own(soda, 'onMessage', function (fn) {
      if (typeof fn !== 'function') return function () {};
      var id = listenerCount++;
      own(listeners, id, fn);
      return function () { delete listeners[id]; };
    });
    own(soda, 'theme', objFreeze(th));
    return objFreeze(soda);
  }

  function applyTheme(theme) {
    if (!theme || typeof theme !== 'object') return;
    var de = rd(docElement, DOC, 'documentElement');
    rApply(setAttribute, de, ['data-dark', theme.dark ? '1' : '0']);
    var vars = theme.vars;
    if (vars && typeof vars === 'object') {
      var ks = objKeys(vars);
      var st = rd(elStyle, de, 'style');
      for (var i = 0; i < ks.length; i++) {
        if (rApply(RegExpTest, THEME_VAR_RE, [ks[i]]) && typeof vars[ks[i]] === 'string') {
          if (styleSetProperty) rApply(styleSetProperty, st, [ks[i], vars[ks[i]]]);
          else st.setProperty(ks[i], vars[ks[i]]);

  // --- 中身を DOM に差し込む ---------------------------------------------------------------------------------
  function copyAttributes(from, to) {
    var attrs = rd(elAttributes, from, 'attributes');
    var n = rd(attrMapLen, attrs, 'length');

      try { rApply(setAttribute, to, [rd(attrName, attrs[i], 'name'), rd(attrValue, attrs[i], 'value')]); } catch (e) { /* 不正な属性名は飛ばす */ }

  /** <script> の中身（子の文字ノードをつなぐ）。 */
  function scriptText(el) {
    var kids = rd(nodeChildren, el, 'childNodes');

    var kn = rd(nodeListLen, kids, 'length');

   * `<script>` は、そのまま移すと動かない（パーサーが作ったものは「実行済み」）ので、同じ属性と中身の新しい `<script>` を作って、その位置に入れる
   * （インラインのスクリプトは、入れた時点で同期に動く）。`src` の子は live ではないので、添え字で辿ってよい（`src` は変わらない）。
   */

    var kids = rd(nodeChildren, src, 'childNodes');
    var kcount = rd(nodeListLen, kids, 'length');
    for (var i = 0; i < kcount; i++) {
      var n = kids[i];

        rApply(nodeAppend, liveParent, [rApply(docCreateTextNode, DOC, [rd(charData, n, 'data')])]);
      } else if (t === 8) {
