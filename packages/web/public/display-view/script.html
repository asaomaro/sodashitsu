<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>表示（スクリプト）</title>
<style>
/* 既定。:where で詳細度を 0 にしてあるので、中身のスタイルが常に勝つ。色は、親が render で渡す変数（アプリの --soda-*）で決まる。 */
:where(:root){color-scheme:light dark;--soda-bg:#1e1f29;--soda-fg:#f8f8f2;--soda-menu-bg:#282a36;--soda-menu-border:#44475a;--soda-accent:#6070a1;--soda-accent-fg:#f8f8f2;--soda-subtle-bg:rgba(255,255,255,.08);--soda-error-fg:#ff5555;--soda-warn-fg:#ffb86c}
:where(:root[data-dark="0"]){color-scheme:light}
:where(:root[data-dark="1"]){color-scheme:dark}
:where(html,body){margin:0}
:where(body){background:var(--soda-bg);color:var(--soda-fg);font:14px/1.6 system-ui,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",sans-serif;min-height:100vh}
</style>
<script>
// 表示の面（スクリプトが動く形式 `script-html`）の枠の土台。20261007-soda-extensions の design「スクリプトが動く形式」。
// アプリ本体の iframe（sandbox="allow-scripts"。allow-same-origin なし＝不透明 origin）が開く。親とのやりとりは MessageChannel の port だけ。
// **このスクリプトは頁の中に直に書く**（別ファイルにしない＝CSP の script-src に 'self' を付けない。中身のスクリプトが同じ origin の URL を <script src> で読めないように）。
// 中身（作者のスクリプトを含む）は、この土台の**あとで**、同じ window に **DOM として差し込む**（document.open()/document.write() は使わない）。
//
// 守り方: 中身のスクリプトは土台と同じ window で動く。土台が持つもの（port・soda）は、中身から書き換えられる・呼べる・ほかの窓へ渡せる、という前提で作る
// （守るのは枠の外。枠の中に、守るべきものを置かない。枠の言うことは、親とサーバが確かめる）。ただし、
//  - 名前の上書き（DOM clobbering）と、プロトタイプの差し替えに備え、読み込み時（中身を入れる前）に控えた Document/Element/Node/EventTarget/MessagePort のメソッドと getter を
//    `call` で使い、中身の要素・document のプロパティを直接読まない。
//  - Esc の取り次ぎは、中身より先に付ける。prefix は取り次がない（利用者のキーの設定を、信頼できない中身に教えない）。
(function () {
  'use strict';
  var ACTION_RE = /^[A-Za-z0-9_.:-]{1,64}$/;
  var FIELDS_MAX = 64;
  var KEY_MAX = 64;
  var DATA_MAX_BYTES = 8 * 1024;
  var SVG_NS = 'http://www.w3.org/2000/svg';

  // --- 読み込み時に控える（中身を入れる前）-------------------------------------------------------------------
  function getterOf(proto, name) {
    for (var o = proto; o; o = Object.getPrototypeOf(o)) {
      var d = Object.getOwnPropertyDescriptor(o, name);
      if (d && d.get) return d.get;
    }
    return undefined;
  }
  var D = Document.prototype;
  var E = Element.prototype;
  var N = Node.prototype;
  var PARENT = parent;
  var docCreateElementNS = D.createElementNS;
  var docCreateTextNode = D.createTextNode;
  var docCreateComment = D.createComment;
  var docImportNode = D.importNode;
  var docBody = getterOf(D, 'body');
  var docHead = getterOf(D, 'head');
  var docElement = getterOf(D, 'documentElement');
  var docReady = getterOf(D, 'readyState');
  var addListener = EventTarget.prototype.addEventListener;
  var dispatch = EventTarget.prototype.dispatchEvent;
  var setAttribute = E.setAttribute;
  var nodeAppend = N.appendChild;
  var nodeChildren = getterOf(N, 'childNodes');
  var nodeType = getterOf(N, 'nodeType');
  var charData = typeof CharacterData !== 'undefined' ? getterOf(CharacterData.prototype, 'data') : undefined;
  var elLocalName = getterOf(E, 'localName');
  var elNamespace = getterOf(E, 'namespaceURI');
  var elAttributes = getterOf(E, 'attributes');
  var attrName = typeof Attr !== 'undefined' ? getterOf(Attr.prototype, 'name') : undefined;
  var attrValue = typeof Attr !== 'undefined' ? getterOf(Attr.prototype, 'value') : undefined;
  // ブラウザは getter を prototype に持つ。持たない実装（単体テストの DOM）では、直に読む。
  function read(getter, obj, prop) { return getter ? getter.call(obj) : obj[prop]; }
  var slice = Array.prototype.slice;
  var objectKeys = Object.keys;
  var objectFreeze = Object.freeze;
  var jsonStringify = JSON.stringify;
  var EventCtor = Event;
  var ParserCtor = DOMParser;
  var Encoder = TextEncoder;
  var portPost = typeof MessagePort === 'function' ? MessagePort.prototype.postMessage : null;
  var winFocus = window.focus;
  var winScrollBy = window.scrollBy;
  var ticket = new URLSearchParams(location.search).get('t') || '';
  var port = null;
  var inited = false;
  var rendered = false; // render は 1 つの枠につき 1 回だけ（2 回目以降は無視。中身・形式・版が替わったら、親が枠を作り直す）
  var rev = 0;
  var listeners = [];

  function post(msg) {
    if (!port) return;
    // 本物の MessagePort には、控えたメソッドで送る（中身が MessagePort.prototype.postMessage を差し替えても、port は拾われない）。
    if (portPost && typeof MessagePort === 'function' && port instanceof MessagePort) portPost.call(port, msg);
    else port.postMessage(msg);
  }

  function isPlainStringMap(data) {
    if (typeof data !== 'object' || data === null || Array.isArray(data)) return false;
    var keys = objectKeys(data);
    if (keys.length > FIELDS_MAX) return false;
    for (var i = 0; i < keys.length; i++) {
      var n = Array.from(keys[i]).length;
      if (n < 1 || n > KEY_MAX || typeof data[keys[i]] !== 'string') return false;
    }
    return new Encoder().encode(jsonStringify(data)).length <= DATA_MAX_BYTES;
  }

  /** window.soda。action は、規則の外の名前・値なら false を返して送らない（静的な形式の data-soda-action と同じ規則）。 */
  function makeSoda(theme) {
    var vars = {};
    if (theme && typeof theme.vars === 'object' && theme.vars) {
      objectKeys(theme.vars).forEach(function (k) { if (typeof theme.vars[k] === 'string') vars[k] = theme.vars[k]; });
    }
    var soda = {
      version: 1,
      action: function (name, data) {
        if (typeof name !== 'string' || !ACTION_RE.test(name)) return false;
        if (data !== undefined && !isPlainStringMap(data)) return false;
        var m = { type: 'action', rev: rev, action: name };
        if (data !== undefined) m.data = data;
        post(m);
        return true;
      },
      onMessage: function (fn) {
        if (typeof fn !== 'function') return function () {};
        listeners.push(fn);
        return function () {
          var i = listeners.indexOf(fn);
          if (i >= 0) listeners.splice(i, 1);
        };
      },
      theme: objectFreeze({ dark: !!(theme && theme.dark), vars: objectFreeze(vars) }),
    };
    return objectFreeze(soda);
  }

  function applyTheme(theme) {
    if (!theme || typeof theme !== 'object') return;
    var de = read(docElement, document, 'documentElement');
    setAttribute.call(de, 'data-dark', theme.dark ? '1' : '0');
    var vars = theme.vars;
    if (vars && typeof vars === 'object') {
      objectKeys(vars).forEach(function (k) {
        if (/^--[A-Za-z0-9-]+$/.test(k) && typeof vars[k] === 'string') de.style.setProperty(k, vars[k]);
      });
    }
  }

  // --- 中身を DOM に差し込む ---------------------------------------------------------------------------------
  function copyAttributes(from, to) {
    var attrs = read(elAttributes, from, 'attributes');
    for (var i = 0; i < attrs.length; i++) {
      try { setAttribute.call(to, read(attrName, attrs[i], 'name'), read(attrValue, attrs[i], 'value')); } catch (e) { /* 不正な属性名は飛ばす */ }
    }
  }
  /**
   * 解釈した木の `src` の子を、`liveParent`（いまの文書の中）へ、文書の順に 1 つずつ入れる。親を先に入れてから子を入れる（パーサーと同じ順）。
   * `<script>` は、そのまま移すと動かない（パーサーが作ったものは「実行済み」）ので、同じ属性と中身の新しい `<script>` を作って、その位置に入れる
   * （インラインのスクリプトは、入れた時点で同期に動く）。
   */
  /** <script> の中身（子の文字ノードをつなぐ）。 */
  function scriptText(el) {
    var kids = slice.call(read(nodeChildren, el, 'childNodes'));
    var out = '';
    for (var i = 0; i < kids.length; i++) if (read(nodeType, kids[i], 'nodeType') === 3) out += read(charData, kids[i], 'data');
    return out;
  }
  function insertChildren(src, liveParent) {
    var kids = slice.call(read(nodeChildren, src, 'childNodes'));
    for (var i = 0; i < kids.length; i++) {
      var n = kids[i];
      var t = read(nodeType, n, 'nodeType');
      if (t === 3) {
        nodeAppend.call(liveParent, docCreateTextNode.call(document, read(charData, n, 'data')));
      } else if (t === 8) {
        nodeAppend.call(liveParent, docCreateComment.call(document, read(charData, n, 'data')));
      } else if (t === 1) {
        var name = read(elLocalName, n, 'localName');
        if (name === 'script') {
          var ns = read(elNamespace, n, 'namespaceURI');
          var script = docCreateElementNS.call(document, ns === SVG_NS ? SVG_NS : 'http://www.w3.org/1999/xhtml', 'script');
          copyAttributes(n, script);
          var code = scriptText(n);
          if (ns === SVG_NS) script.textContent = code;
          else script.text = code;
          nodeAppend.call(liveParent, script); // ここで動く
        } else if (name === 'template') {
          nodeAppend.call(liveParent, docImportNode.call(document, n, true)); // template の中身は inert
        } else {
          var live = docImportNode.call(document, n, false);
          nodeAppend.call(liveParent, live);
          insertChildren(n, live);
        }
      }
    }
  }
  function inject(source) {
    var liveHtml = read(docElement, document, 'documentElement');
    var liveHead = read(docHead, document, 'head');
    var liveBody = read(docBody, document, 'body');
    var doc = new ParserCtor().parseFromString(source, 'text/html');
    var parsedHtml = read(docElement, doc, 'documentElement');
    var parsedHead = read(docHead, doc, 'head');
    var parsedBody = read(docBody, doc, 'body');
    copyAttributes(parsedHtml, liveHtml);
    if (parsedBody) copyAttributes(parsedBody, liveBody);
    if (parsedHead) insertChildren(parsedHead, liveHead);
    if (parsedBody) insertChildren(parsedBody, liveBody);
  }

  function onRender(m) {
    if (rendered) return;
    rendered = true;
    if (typeof m.rev !== 'number') return;
    if (m.format !== 'script-html' || typeof m.source !== 'string') {
      post({ type: 'rejected', rev: m.rev });
      return;
    }
    rev = m.rev;
    try {
      // (i) soda を置く (ii) Esc の取り次ぎを、中身より先に付ける (iii) テーマ (iv) 中身を差し込む (v) DOMContentLoaded・load を 1 回ずつ起こす (vi) rendered
      window.soda = makeSoda(m.theme);
      addListener.call(window, 'keydown', function (e) {
        if (e.isComposing || e.keyCode === 229) return;
        if (e.key === 'Escape') {
          e.preventDefault();
          post({ type: 'key', key: 'escape' });
        }
      }, true);
      applyTheme(m.theme);
      inject(m.source);
      dispatch.call(document, new EventCtor('DOMContentLoaded', { bubbles: true }));
      dispatch.call(window, new EventCtor('load'));
      post({ type: 'rendered', rev: m.rev });
    } catch (e) {
      post({ type: 'failed', rev: m.rev });
    }
  }

  function onPort(ev) {
    var m = ev.data;
    if (!m || typeof m !== 'object') return;
    switch (m.type) {
      case 'ping':
        post({ type: 'pong', n: m.n });
        break;
      case 'render':
        onRender(m);
        break;
      case 'message':
        // 登録の順に呼ぶ。1 つが投げても、ほかを呼ぶ。
        slice.call(listeners).forEach(function (fn) { try { fn(m.data); } catch (e) { /* 中身の例外は、中身のもの */ } });
        break;
      case 'scroll':
        if (typeof m.dx === 'number' && typeof m.dy === 'number' && isFinite(m.dx) && isFinite(m.dy) && winScrollBy) winScrollBy.call(window, m.dx, m.dy);
        break;
      case 'focus':
        if (winFocus) winFocus.call(window);
        break;
    }
  }

  addListener.call(window, 'message', function (ev) {
    if (inited || ev.source !== PARENT) return;
    var m = ev.data;
    if (!m || typeof m !== 'object' || m.type !== 'display-init' || !ev.ports || ev.ports.length < 1) return;
    inited = true;
    port = ev.ports[0];
    port.onmessage = onPort;
  });

  // 読み込みの最後に、合い札を添えて親に知らせる（親は、合い札と最初の load が合ってから通り道を渡す）。
  function ready() {
    PARENT.postMessage({ type: 'display-ready', t: ticket }, '*');
  }
  if (read(docReady, document, 'readyState') === 'complete') ready();
  else addListener.call(window, 'load', ready);
})();
</script>
</head>
<body>
</body>
</html>
