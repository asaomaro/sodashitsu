# IBM Bob Shell（npm の bobshell）。20261016-bob-shell で、実機 2.0.6 の画面（日本語・英語）から起こした。
# 画面の文言は利用者のロケールで替わる（15 言語）ので、文言ではなく、言語に依らない印で見る:
# - 作業中: 入力の枠のすぐ上の行が点字のスピナーで始まる（例 `⠼ Processing… (Enter to steer, Tab to queue)`・`⠇ 処理中… (…)`）。
# - 承認待ち: 選択肢の位置 `↑↓ (1/3)` が出ていて、入力の枠（横線のすぐ下の `❯` の行）が無い（承認・信頼の確認のときは枠が消える）。
#   `/` のメニューなど、入力の枠が残っている一覧は、承認待ちにしない。
# どれにも当たらなければ待機（入力待ち）。
id = "bob"
version = "2026.10.16.1"
min_engine_version = 1
updated_at = "2026-10-16T00:00:00Z"
aliases = ["bob-shell", "bobshell"]

[[rules]]
id = "selection_dialog_blocked"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(12)"
visible_blocker = true
line_regex = ['^\s*↑↓ \(\d+/\d+\)\s*$']
not = [
  # 行をまたがない空白（`[^\S\n]`）だけを許す。`\s` は改行にも当たり、空行を挟んだ前の返答の横線と発言の `❯` を枠と取り違える。
  { regex = ['(?m)^[^\S\n]*─{10,}[^\S\n]*\n[^\S\n]*❯'] },
]

[[rules]]
id = "spinner_working"
state = "working"
priority = 100
region = "last_non_empty_above_prompt_box"
visible_working = true
line_regex = ['^\s*[\x{2800}-\x{28FF}]\s+\S']
