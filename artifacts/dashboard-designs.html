<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>操舵室 利用ダッシュボード 3案</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.6 system-ui,sans-serif;background:#0b1220;color:#e7edf8}button,select{font:inherit;border:1px solid #34445e;border-radius:9px;background:#18243a;color:inherit;padding:9px 15px;cursor:pointer}button[aria-pressed=true]{background:#6ddac3;color:#082c2a;border-color:#6ddac3}header{padding:20px 28px;background:#101c2e;border-bottom:1px solid #29384e;display:flex;gap:12px;flex-wrap:wrap;align-items:center}header strong{margin-right:auto}main{max-width:1360px;margin:auto;padding:28px}.intro{display:flex;align-items:start;justify-content:space-between;gap:18px}h1{font-size:27px;letter-spacing:-1px;margin:0}h2{font-size:15px;margin:0 0 18px}p{color:#a5b5ce}small,.sub{color:#93a7c5}.sample{color:#f3c96a}.filters{display:flex;flex-wrap:wrap;gap:9px;margin:24px 0}.metrics,.grid{display:grid;gap:18px}.metrics{grid-template-columns:repeat(4,1fr);margin-bottom:20px}.grid{grid-template-columns:1.6fr 1fr}.card{background:#142137;border:1px solid #2a3952;border-radius:17px;padding:22px;min-width:0}.metric strong{display:block;font-size:30px}.metric em{font-size:12px;font-style:normal;color:#74e2c5}.wide{grid-column:1/-1}.chart{width:100%;height:205px;display:block}.legend{display:flex;flex-wrap:wrap;gap:20px;color:#b9c8dc;margin-top:10px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--color,#69d8bf)}.donut{width:185px;aspect-ratio:1;border-radius:50%;background:conic-gradient(#6ddac3 0 38%,#8c91ff 38% 100%);display:grid;place-items:center;margin:auto;position:relative}.donut:before{content:'';position:absolute;inset:25px;border-radius:50%;background:#142137}.donut span{position:relative;text-align:center;font-size:26px}.donut small{display:block;font-size:12px}.bars>div{display:grid;grid-template-columns:84px 1fr 44px;gap:12px;align-items:center;margin:16px 0}.track{height:12px;background:#26364f;border-radius:10px;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,#6ddac3,#8c91ff);border-radius:10px}.heat{display:grid;grid-template-columns:repeat(18,1fr);gap:5px}.heat i{aspect-ratio:1;border-radius:3px;background:#6ddac3;opacity:var(--opacity)}.state{padding:10px 14px;background:#172b36;border-radius:8px;color:#a8ded6}.note{display:none}.flow{display:flex;align-items:center;gap:16px;justify-content:center;flex-wrap:wrap;min-height:205px}.node{border:1px solid #6ddac3;border-radius:16px;padding:18px;text-align:center;background:#172e3d}.node.child{border-color:#9295ff;background:#262744}.line{color:#71879d;font-size:30px}.children{display:grid;gap:12px}.table{width:100%;border-collapse:collapse}.table td,.table th{text-align:left;border-bottom:1px solid #2a3b56;padding:13px 5px}.badge{display:inline-block;padding:3px 9px;border-radius:12px;background:#30453c;color:#93e6c5}.choice{margin-top:20px;display:flex;flex-wrap:wrap;gap:10px}.detail{margin-top:18px;padding:15px;border:1px solid #3b5269;border-radius:12px;color:#c0d1e8}.light{background:#edf2f8;color:#18243a}.light .card{background:#fff;border-color:#d1dbe9}.light header{background:#fff}.light .donut:before{background:white}.light p,.light small,.light .sub{color:#54657c}.light button,.light select{background:#fff;color:#18243a}.light .state{background:#dff1ec;color:#20564d}.light .node{background:#e3f6f0;color:#173d37}.light .node.child{background:#ececfe;color:#373763}@media(max-width:820px){main{padding:18px}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.intro{display:block}header{padding:15px}.chart{height:170px}}
</style><header><strong>◉ Sodashitsu / エージェント利用分析</strong><button data-plan="a" aria-pressed="true">A ビジュアル概要</button><button data-plan="b" aria-pressed="false">B 比較と探索</button><button data-plan="c" aria-pressed="false">C エージェント運用</button><button id="theme">明暗切替</button></header><main><div class="intro"><div><span class="sample">DESIGN PREVIEW · サンプルデータ</span><h1 id="title">ひと目で、利用の全体像を。</h1><p id="description">主要な数字、推移、委譲とツールの構成をひとつの画面で把握する案。</p></div><span class="state">● 2台接続 · 4種類取得<br>最終集計 10:32 · 一部未取得</span></div><div class="filters"><select id="period"><option>過去30日</option><option>過去7日</option><option>過去90日</option></select><select><option>すべてのPC</option><option>ローカル</option><option>作業PC</option></select><select><option>すべてのプロジェクト</option><option>操舵室</option><option>ゆっくり動画制作</option></select><select id="agent"><option>すべてのエージェント</option><option>Claude Code</option><option>Codex</option></select><button id="inspect">取得範囲を確認</button></div><div class="metrics"><div class="card metric"><small>期間のトークン</small><strong id="total">24.8M</strong><em>前期間比 +12.4%</em></div><div class="card metric"><small>サブエージェントの比率</small><strong>62.0<small>%</small></strong><em>メイン 9.4M / サブ 15.4M</em></div><div class="card metric"><small>ツール呼び出し</small><strong>3,842</strong><em>結果取得 91% · 成功 97.2%</em></div><div class="card metric"><small>キャッシュ読取率</small><strong>78.4<small>%</small></strong><em>入力＋キャッシュ読取を分母に集計</em></div></div><div id="panels" class="grid"></div><div id="detail" class="detail" hidden></div><div class="choice"><button id="choose">この案を候補にする</button><span id="chosen" class="sub">案を切り替えて、情報の配置と見せ方を比較できます。</span></div></main><script>
const panels=document.getElementById('panels');let current='a';
const line='<svg class="chart" viewBox="0 0 650 205" role="img" aria-label="メインとサブの期間トークン推移"><g stroke="#33455d" stroke-width="1"><path d="M0 35H650M0 85H650M0 135H650M0 185H650"/></g><path d="M0 180L40 168 80 174 120 142 160 151 200 119 240 138 280 102 320 109 360 69 400 93 440 50 480 77 520 35 560 66 610 25 650 41V205H0Z" fill="#8c91ff" opacity=".65"/><path d="M0 190L40 184 80 187 120 176 160 171 200 156 240 163 280 148 320 153 360 129 400 140 440 116 480 130 520 108 560 121 610 97 650 106V205H0Z" fill="#6ddac3"/><path d="M0 162Q150 140 250 155T450 98T650 77" stroke="#e8b65e" fill="none" stroke-dasharray="6 6"/></svg><div class="legend"><span><i class="dot"></i>メイン</span><span><i class="dot" style="--color:#8c91ff"></i>サブエージェント</span><span><i class="dot" style="--color:#e8b65e"></i>前期間</span></div>';
const tools='<div class="bars">'+[['シェル',42],['ファイル',25],['検索',16],['MCP',12],['Skill',5]].map(([s,n])=>`<div><span>${s}</span><div class="track"><i style="width:${n*2}%"></i></div><strong>${n}%</strong></div>`).join('')+'</div><small>直接記録されたSkillと、ファイル読取からの推定は分けて表示</small>';
const donut='<div class="donut"><span>62%<small>サブへの委譲</small></span></div><div class="legend"><span><i class="dot"></i>メイン 38%</span><span><i class="dot" style="--color:#8c91ff"></i>サブ 62%</span></div>';
const projects='<div class="bars">'+[['操舵室',68],['動画制作',24],['その他',8]].map(([s,n])=>`<div><span>${s}</span><div class="track"><i style="width:${n}%"></i></div><strong>${n}%</strong></div>`).join('')+'</div>';
const flow='<div class="flow"><div class="node">監督 / Codex<br><strong>4.2M tok</strong><br><small>メインセッション</small></div><span class="line">→</span><div class="children"><div class="node child">実装 / 6.4M tok · Bash 48%</div><div class="node child">レビュー / 2.1M tok · Read 62%</div><div class="node child">調査 / 1.8M tok · MCP 54%</div></div></div>';
const heat='<div class="heat">'+Array.from({length:90},(_,i)=>`<i style="--opacity:${.12+((i*37)%9)/10}" title="${i+1}番目の時間枠"></i>`).join('')+'</div><small>曜日 × 時間帯 · ローカル時刻</small>';
const card=(title,content,wide=false)=>`<section class="card ${wide?'wide':''}"><h2>${title}</h2>${content}</section>`;
function render(key){current=key;document.querySelectorAll('[data-plan]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.plan===key)));document.getElementById('title').textContent={a:'ひと目で、利用の全体像を。',b:'比較して、消費の理由を探る。',c:'エージェントの動きを、利用量とつなぐ。'}[key];document.getElementById('description').textContent={a:'概要から詳細へ進む。日常確認に向いた、余白のあるカード中心の案。',b:'期間・プロジェクト・モデルを横断して比較する。大きなグラフを中心に据えた案。',c:'親子関係とツール利用を接続図で把握する。監督・運用に重点を置く案。'}[key];panels.innerHTML=key==='a'?card('利用推移 / 前期間との比較',line)+card('メインとサブエージェント',donut)+card('ツール利用の構成',tools)+card('プロジェクト別の消費',projects):key==='b'?card('期間比較 / エージェント別の利用推移',line,true)+card('プロジェクトを比較',projects)+card('ツール構成を比較',tools)+card('利用が集中する時間帯',heat,true):card('メインからサブへの委譲',flow,true)+card('ツール利用の構成',tools)+card('利用制限と到達見込み','<div class="bars"><div><span>Claude</span><div class="track"><i style="width:72%"></i></div><strong>72%</strong></div><div><span>Codex</span><div class="track"><i style="width:38%"></i></div><strong>38%</strong></div></div><p>Claude · 直近の観測ペースでは約1時間40分で上限に到達</p><small>推定 · 8観測 / リセットまで3時間</small>')+card('利用推移',line,true);document.getElementById('detail').hidden=true;}
document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>render(b.dataset.plan));document.getElementById('theme').onclick=()=>document.body.classList.toggle('light');document.getElementById('inspect').onclick=()=>{const d=document.getElementById('detail');d.hidden=!d.hidden;d.textContent='サンプルの取得状況：Claude 182件 / Codex 94件。2セッションは記録欠損。MCPはサーバー名・ツール名で分類。Skillは直接記録 38件、推定 12件を区別。欠損を0として計算しません。';};document.getElementById('choose').onclick=()=>document.getElementById('chosen').textContent='候補：'+{a:'A ビジュアル概要',b:'B 比較と探索',c:'C エージェント運用'}[current]+'（選好のプレビューです。採用はチャットで指定できます）';document.getElementById('period').onchange=e=>document.getElementById('total').textContent={'過去30日':'24.8M','過去7日':'6.2M','過去90日':'71.3M'}[e.target.value];render('a');
</script></html>
